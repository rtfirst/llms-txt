name: TER Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yaml

  ter-publish:
    name: Publish to TER
    runs-on: ubuntu-latest
    needs: ci
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      # Create the GitHub release (if missing) and attach the TER artefact
      contents: write
    env:
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, json, zip, curl

      - name: Install TYPO3 Tailor
        run: composer global require typo3/tailor --no-progress

      # TER packages are used in classic mode (no Composer): ship the Composer packages the
      # extension needs at runtime (extra.typo3/cms.Package.providesPackages in composer.json)
      - name: Bundle Composer dependencies for classic mode
        run: php Build/Scripts/bundleClassicDependencies.php

      - name: Create TER artefact
        id: artefact
        run: |
          ~/.composer/vendor/bin/tailor create-artefact ${{ steps.version.outputs.version }} rt_llms_txt
          echo "file=tailor-version-artefact/rt_llms_txt_${{ steps.version.outputs.version }}.zip" >> $GITHUB_OUTPUT

      - name: Check TER artefact for classic mode
        run: |
          mkdir -p .Build/artefact
          unzip -q "${{ steps.artefact.outputs.file }}" -d .Build/artefact
          php Build/Scripts/checkClassicArtefact.php .Build/artefact v13
          php Build/Scripts/checkClassicArtefact.php .Build/artefact v14

      - name: Publish to TER
        run: |
          ~/.composer/vendor/bin/tailor ter:publish \
            --comment "Release version ${{ steps.version.outputs.version }}" \
            --artefact "${{ steps.artefact.outputs.file }}" \
            ${{ steps.version.outputs.version }} \
            rt_llms_txt

      # Classic mode installations from GitHub need this zip, the "Source code" archives
      # of the release do not contain the bundled Composer packages
      - name: Attach TER artefact to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "${VERSION}" > /dev/null 2>&1; then
            # Release notes: section of this version in CHANGELOG.md
            awk -v heading="## [${VERSION}]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md
            gh release create "${VERSION}" --verify-tag --title "${VERSION}" --notes-file release-notes.md
          fi
          gh release upload "${VERSION}" "${{ steps.artefact.outputs.file }}" --clobber
