name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_call:

# Cancel outdated runs of a pull request when new commits are pushed. Pushes to
# main/develop and the call from ter-publish.yaml (tags) always run to the end.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: php-cs-fixer

      - name: Run PHP-CS-Fixer
        run: php-cs-fixer fix --dry-run --diff

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    needs: php-cs-fixer
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']
        typo3-version: ['^13.4']
        # Note: TYPO3 14 excluded until saschaegerer/phpstan-typo3 supports it
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl, pdo_sqlite

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-phpstan-${{ matrix.php-version }}-${{ matrix.typo3-version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-phpstan-${{ matrix.php-version }}-${{ matrix.typo3-version }}-
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          composer require typo3/cms-core:${{ matrix.typo3-version }} typo3/cms-frontend:${{ matrix.typo3-version }} --no-progress --no-interaction
          composer install --no-progress --no-interaction

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --level=8 --configuration=phpstan.neon

  rector:
    name: Rector
    runs-on: ubuntu-latest
    needs: php-cs-fixer
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, pdo_sqlite

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-rector-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-rector-

      - name: Install dependencies
        run: |
          composer require typo3/cms-core:^13.4 typo3/cms-frontend:^13.4 --no-progress --no-interaction
          composer install --no-progress --no-interaction

      - name: Run Rector
        run: vendor/bin/rector process --dry-run --config=rector.php

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [phpstan, rector]
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']
        typo3-version: ['^13.4', '^14.0']
        exclude:
          # TYPO3 14 requires PHP 8.3+
          - php-version: '8.2'
            typo3-version: '^14.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-tests-${{ matrix.php-version }}-${{ matrix.typo3-version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-tests-${{ matrix.php-version }}-${{ matrix.typo3-version }}-
            ${{ runner.os }}-composer-

      - name: Remove incompatible dev dependencies for TYPO3 14
        if: matrix.typo3-version == '^14.0'
        run: |
          composer remove --dev saschaegerer/phpstan-typo3 --no-interaction --no-update

      - name: Install dependencies
        run: |
          composer require typo3/cms-core:${{ matrix.typo3-version }} typo3/cms-frontend:${{ matrix.typo3-version }} --no-progress --no-interaction
          composer install --no-progress --no-interaction

      - name: Run Unit Tests
        run: vendor/bin/phpunit --configuration=phpunit.xml

  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: [phpstan, rector]
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']
        typo3-version: ['^13.4', '^14.0']
        exclude:
          # TYPO3 14 requires PHP 8.3+
          - php-version: '8.2'
            typo3-version: '^14.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl, pdo_sqlite, sqlite3
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-functional-${{ matrix.php-version }}-${{ matrix.typo3-version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-functional-${{ matrix.php-version }}-${{ matrix.typo3-version }}-
            ${{ runner.os }}-composer-

      - name: Remove incompatible dev dependencies for TYPO3 14
        if: matrix.typo3-version == '^14.0'
        run: |
          composer remove --dev saschaegerer/phpstan-typo3 --no-interaction --no-update

      - name: Install dependencies
        run: |
          composer require typo3/cms-core:${{ matrix.typo3-version }} typo3/cms-frontend:${{ matrix.typo3-version }} --no-progress --no-interaction
          composer install --no-progress --no-interaction

      - name: Run Functional Tests
        env:
          typo3DatabaseDriver: pdo_sqlite
          typo3DatabaseName: typo3_test
        run: vendor/bin/phpunit --configuration=phpunit.functional.xml

  ter-artefact:
    name: TER Artefact (classic mode)
    runs-on: ubuntu-latest
    needs: php-cs-fixer
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, json, zip
          coverage: none

      - name: Install TYPO3 Tailor
        run: composer global require typo3/tailor --no-progress

      - name: Bundle Composer dependencies for classic mode
        run: php Build/Scripts/bundleClassicDependencies.php

      - name: Create TER artefact
        run: |
          VERSION=$(php -r '$_EXTKEY = "rt_llms_txt"; include "ext_emconf.php"; echo $EM_CONF[$_EXTKEY]["version"];')
          ~/.composer/vendor/bin/tailor create-artefact "${VERSION}" rt_llms_txt
          mkdir -p .Build/artefact
          unzip -q "tailor-version-artefact/rt_llms_txt_${VERSION}.zip" -d .Build/artefact

      - name: Check TER artefact (TYPO3 v13 classic mode)
        run: php Build/Scripts/checkClassicArtefact.php .Build/artefact v13

      - name: Check TER artefact (TYPO3 v14 classic mode)
        run: php Build/Scripts/checkClassicArtefact.php .Build/artefact v14
